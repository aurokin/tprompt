name: CI

# PR-triggered health gate. Mirrors the documented merge gate
# (`make check` = fmt-check + lint + race tests) so a PR can't merge
# without passing the same checks a contributor runs locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # post-merge signal on main

permissions:
  contents: read

# Supersede in-flight runs when a PR branch is updated; only the
# latest commit's status gates the merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # testdata/script/*.txtar testscripts exec real tmux, which is
      # not preinstalled on ubuntu-latest. Install before `make test`.
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Installs pinned golangci-lint / gofumpt / goimports into
      # $(go env GOPATH)/bin, which `make fmt-check` / `make lint` use.
      - name: Install pinned tools
        run: make tools

      - name: Health gate (fmt-check + lint + race tests)
        run: make check
