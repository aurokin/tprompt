name: Bump Homebrew formula

# Updates Formula/tprompt.rb in the aurokin/homebrew-tap repo whenever a release
# is PUBLISHED. The `published` activity type fires when an operator un-drafts a
# release — which is exactly our flow: release.yml ships a draft, the operator
# verifies the tarballs locally, then publishes. Triggering here (not on tag
# push) guarantees the release assets are public, so SHA256SUMS is fetchable and
# `brew install`/`brew audit` against the tap will succeed.
on:
  release:
    types: [published]

# This repo only needs read; the cross-repo push to the tap uses a
# fine-grained PAT (HOMEBREW_TAP_TOKEN) — GITHUB_TOKEN cannot write another repo.
permissions:
  contents: read

# Serialize bumps so two rapid publishes can't race the tap's main branch.
concurrency:
  group: bump-homebrew
  cancel-in-progress: false

jobs:
  bump:
    name: Bump tap formula
    # Stable releases only — gate on BOTH signals. release.yml does not set
    # `prerelease:` on the draft, so GitHub's prerelease flag can be false even
    # for an `-rc` tag. The repo's convention is that any `-` in the tag (e.g.
    # v1.2.3-rc1) marks a prerelease (see the verify job's `${tag%%-*}` base
    # check), so a hyphenated tag must never move the tap regardless of the flag.
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and checksums from the published release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The release is published, so its assets are downloadable. Pull the
          # checksum manifest rather than re-hashing the tarballs — it inherits
          # the operator's verified artifacts. release.yml generates it on
          # ubuntu/GNU coreutils, whose `sha256sum` defaults to TEXT mode:
          # "<hash><space><space><filename>" with no '*' binary marker, so awk
          # collapses the whitespace run and $2 is the bare filename. (Verified
          # against the real v0.2.1 SHA256SUMS asset.)
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --output SHA256SUMS
          sha_for() {
            local f="$1" h
            h="$(awk -v f="$f" '$2 == f { print $1 }' SHA256SUMS)"
            if [ -z "$h" ]; then
              echo "::error::missing sha256 for $f in the release's SHA256SUMS" >&2
              exit 1
            fi
            printf '%s' "$h"
          }
          {
            echo "version=${TAG#v}"
            echo "darwin_arm64=$(sha_for tprompt-darwin-arm64.tar.gz)"
            echo "darwin_amd64=$(sha_for tprompt-darwin-amd64.tar.gz)"
            echo "linux_arm64=$(sha_for tprompt-linux-arm64.tar.gz)"
            echo "linux_amd64=$(sha_for tprompt-linux-amd64.tar.gz)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aurokin/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render Formula/tprompt.rb
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.meta.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.meta.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.meta.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.meta.outputs.linux_amd64 }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          # Quoted heredoc: the Ruby regex (\d, $ anchor) and #{bin}
          # interpolation are written literally, untouched by the shell. Only
          # the __TOKENS__ are substituted afterward via sed (all values are
          # hex/semver/tag — no sed-special characters).
          cat > tap/Formula/tprompt.rb <<'RUBY'
          class Tprompt < Formula
            desc "Deliver markdown prompts into tmux panes from the terminal"
            homepage "https://github.com/aurokin/tprompt"
            version "__VERSION__"
            license "MIT"

            livecheck do
              url :stable
              strategy :git
              regex(/^v?(\d+(?:\.\d+)+)$/i)
            end

            depends_on "tmux"

            on_macos do
              on_arm do
                url "https://github.com/aurokin/tprompt/releases/download/__TAG__/tprompt-darwin-arm64.tar.gz"
                sha256 "__SHA_DARWIN_ARM64__"
              end
              on_intel do
                url "https://github.com/aurokin/tprompt/releases/download/__TAG__/tprompt-darwin-amd64.tar.gz"
                sha256 "__SHA_DARWIN_AMD64__"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/aurokin/tprompt/releases/download/__TAG__/tprompt-linux-arm64.tar.gz"
                sha256 "__SHA_LINUX_ARM64__"
              end
              on_intel do
                url "https://github.com/aurokin/tprompt/releases/download/__TAG__/tprompt-linux-amd64.tar.gz"
                sha256 "__SHA_LINUX_AMD64__"
              end
            end

            def install
              bin.install "tprompt"
            end

            test do
              # tprompt has no version subcommand and its main path needs tmux +
              # a TTY (absent in the brew test sandbox). `--help` exits 0 and its
              # output contains the product tagline.
              assert_match "tmux panes", shell_output("#{bin}/tprompt --help")
            end
          end
          RUBY
          sed -i \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__TAG__|${TAG}|g" \
            -e "s|__SHA_DARWIN_ARM64__|${SHA_DARWIN_ARM64}|g" \
            -e "s|__SHA_DARWIN_AMD64__|${SHA_DARWIN_AMD64}|g" \
            -e "s|__SHA_LINUX_ARM64__|${SHA_LINUX_ARM64}|g" \
            -e "s|__SHA_LINUX_AMD64__|${SHA_LINUX_AMD64}|g" \
            tap/Formula/tprompt.rb

      - name: Commit and push to tap
        working-directory: tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tprompt.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}; nothing to push."
            exit 0
          fi
          git commit -m "tprompt ${VERSION}"
          git push
